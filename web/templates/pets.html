{% extends "base.html" %}{% block title %}Pets{% endblock %}{% block body %}
<table>
  <tr><th>Name</th><th>Kind</th><th>Photos</th><th></th></tr>
  {% for r in rows %}
  <tr>
    <td>{{ r.name }}</td>
    <td>{{ classes.get(r.coco_class_id, "?") }}</td>
    <td>{{ photo_count(r) }}</td>
    <td><button hx-delete="/enrol/animal/{{ r.id }}" hx-target="closest tr" hx-swap="outerHTML" hx-confirm="Forget {{ r.name }}?">forget</button></td>
  </tr>
  {% else %}<tr><td colspan="4" class="muted">No pets enrolled.</td></tr>{% endfor %}
</table>
<form class="card" method="post" action="/enrol/animal" enctype="multipart/form-data">
  <label>Name <input name="name" required></label>
  <label>Kind <select name="class_id">{% for id, kind in classes.items() %}<option value="{{ id }}">{{ kind }}</option>{% endfor %}</select></label>
  <label>Three or more photos, ideally from this camera <input type="file" name="photos" accept="image/*" multiple required></label>
  <button>Enrol</button>
</form>
{% endblock %}
