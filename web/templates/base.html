<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · Intruder Detection</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<nav>
  <a href="/">Live</a><a href="/events">Events</a><a href="/people">People</a><a href="/pets">Pets</a><a href="/cameras">Cameras</a><a href="/telegram">Telegram</a>
  <form method="post" action="/tier" class="tier">
    tier <select name="tier" onchange="this.form.submit()">
      <option value="low" {{ "selected" if tier == "low" }}>low</option>
      <option value="high" {{ "selected" if tier == "high" }}>high</option>
    </select>
  </form>
</nav>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
